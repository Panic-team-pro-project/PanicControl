<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EpiAirConsole - Test Console (Hôte)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #121212; color: #fff; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #4338ca; }
        .status-connected { color: #10b981; }
        .status-disconnected { color: #ef4444; }
        #active-room-code { font-size: 28px; font-weight: bold; letter-spacing: 2px; color: #6366f1; }
        ul { padding-left: 20px; }
        li { margin-bottom: 5px; }
        .error { color: #ef4444; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📺 Écran Console (Hôte)</h1>
    
    <div class="card">
        <h3>État de la connexion</h3>
        <p>Statut : <span id="connection-status" class="status-disconnected">Déconnecté</span></p>
        <p>Socket ID : <span id="socket-id">-</span></p>
    </div>

    <div class="card" id="create-section">
        <h3>Lancer une partie</h3>
        <button id="create-btn">Créer le salon</button>
        <div id="error-message" class="error"></div>
    </div>

    <div class="card" id="room-info-section" style="display: none;">
        <h3>Code du Salon :</h3>
        <div id="active-room-code">-</div>
        <p>En attente de joueurs... (Max 8)</p>
        <h4>Joueurs connectés :</h4>
        <ul id="players-list">
            <li><em>Aucun joueur pour l'instant</em></li>
        </ul>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:3000');

        const statusEl = document.getElementById('connection-status');
        const socketIdEl = document.getElementById('socket-id');
        const createSection = document.getElementById('create-section');
        const roomInfoSection = document.getElementById('room-info-section');
        const activeRoomCodeEl = document.getElementById('active-room-code');
        const playersListEl = document.getElementById('players-list');
        const createBtn = document.getElementById('create-btn');

        socket.on('connect', () => {
            statusEl.textContent = 'Connecté';
            statusEl.className = 'status-connected';
            socketIdEl.textContent = socket.id;
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'Déconnecté';
            statusEl.className = 'status-disconnected';
            socketIdEl.textContent = '-';
        });

        createBtn.addEventListener('click', () => {
            socket.emit('create_room');
        });

        socket.on('room_created', (data) => {
            createSection.style.display = 'none';
            roomInfoSection.style.display = 'block';
            activeRoomCodeEl.textContent = data.roomCode;
        });

        // Réception de la liste des joueurs (correspond à room.players)
        socket.on('update_players', (players) => {
            playersListEl.innerHTML = '';
            
            if (!players || players.length === 0) {
                playersListEl.innerHTML = '<li><em>Aucun joueur pour l\'instant</em></li>';
                return;
            }

            players.forEach(player => {
                const li = document.createElement('li');
                // S'appuie sur la structure Player (socketId, name)
                li.textContent = `🎮 ${player.name} (${player.socketId.substring(0, 4)}...)`;
                playersListEl.appendChild(li);
            });
        });

        // Écoute de l'événement de fermeture de salon (inactivité du backend)
        socket.on('room_closed', (data) => {
            alert(data.message || 'Le salon a été fermé.');
            window.location.reload(); // Recharge la page pour revenir à l'état initial
        });
    </script>
</body>
</html>
