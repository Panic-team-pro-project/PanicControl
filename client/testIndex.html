<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test WebSocket</title>
</head>
<body>
    <h1>Test de connexion WebSocket</h1>
    <p>Ouvre la console de ton navigateur (touche <strong>F12</strong> -> onglet Console) pour voir les logs.</p>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:3000');

        socket.on('connect', () => {
            console.log('✅ Connecté au serveur ! Mon ID est :', socket.id);
        });

        socket.on('disconnect', () => {
            console.log('❌ Déconnecté du serveur.');
        });
    </script>
</body>
</html>
