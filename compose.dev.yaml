# Development stack: Vite and the server, updated when a file changes on the host.
#     docker compose -f compose.dev.yaml up --build --watch
# Uses the "build" stage of each image, which holds the sources and the development dependencies.

name: panic-control-dev

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: build
    command: ['node_modules/.bin/tsx', 'watch', 'src/server.ts']
    env_file:
      - path: server/.env
        required: false
    environment:
      # The port inside the container stays fixed; SERVER_PORT changes the port on the host
      PORT: 3000
    ports:
      - '${SERVER_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 2s
      timeout: 3s
      retries: 30
    develop:
      watch:
        - action: sync
          path: server/src
          target: /app/server/src
        - action: sync
          path: common
          target: /app/common
        - action: rebuild
          path: server/package.json

  web:
    build:
      context: .
      dockerfile: client_host/Dockerfile
      target: build
    working_dir: /app/client_host
    command: ['node', 'node_modules/vite/bin/vite.js', '--host', '0.0.0.0']
    ports:
      - '${VITE_PORT:-5173}:5173'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:5173/']
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: client_host/src
          target: /app/client_host/src
        - action: sync
          path: client_host/public
          target: /app/client_host/public
        # The web app uses the built SDK, so a change there needs a new image
        - action: rebuild
          path: sdk/src
        - action: rebuild
          path: common
        - action: rebuild
          path: client_host/package.json
